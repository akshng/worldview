# Dependency audit, secret scanning and the personal-information check.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: catches new advisories between pushes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Reads package-lock.json, no install needed. Fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Uses .gitleaks.toml (default rules + allowlisted fake fixtures). No licence key is
      # needed for a repository owned by a personal account.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  personal-info:
    name: No personal information
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/check-personal-info.mjs
        env:
          # Optional repository secret: comma-separated names/emails that must never appear.
          # Not available to pull requests from forks; the email checks still run there.
          PERSONAL_INFO_DENYLIST: ${{ secrets.PERSONAL_INFO_DENYLIST }}
