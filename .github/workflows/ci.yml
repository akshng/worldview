# Typecheck, lint, test and build on Linux and Windows with Node 22 and 24.
# No secrets: the app runs on keyless public data and builds without .env.local.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    env:
      # node-llama-cpp: don't download or build llama.cpp binaries on install (no AI in CI).
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Never poll upstream feeds or load a model from CI.
      INGESTION_ENABLED: "false"
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
