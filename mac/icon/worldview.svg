<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#1d2735"/>
      <stop offset="0.55" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#04070b"/>
    </radialGradient>
    <radialGradient id="sea" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#12445a"/>
      <stop offset="0.6" stop-color="#072230"/>
      <stop offset="1" stop-color="#020a10"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d1a"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="globeClip"><circle cx="512" cy="512" r="262"/></clipPath>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)" opacity="0.18" stroke="#3ee6d4" stroke-width="1.5">
    <path d="M100 236H924M100 372H924M100 652H924M100 788H924M236 100V924M372 100V924M652 100V924M788 100V924"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- orbit, back half -->
  <g transform="translate(512 512) rotate(-24)">
    <ellipse rx="372" ry="112" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.35"/>
  </g>

  <!-- globe -->
  <circle cx="512" cy="512" r="262" fill="url(#sea)"/>
  <g clip-path="url(#globeClip)" fill="none" stroke="#3ee6d4" stroke-width="3" opacity="0.55">
    <ellipse cx="512" cy="512" rx="88" ry="262"/>
    <ellipse cx="512" cy="512" rx="176" ry="262"/>
    <ellipse cx="512" cy="512" rx="240" ry="262"/>
    <line x1="512" y1="250" x2="512" y2="774"/>
    <line x1="250" y1="512" x2="774" y2="512"/>
    <path d="M276 400 Q512 440 748 400M276 624 Q512 584 748 624M330 300 Q512 330 694 300M330 724 Q512 694 694 724"/>
  </g>
  <circle cx="512" cy="512" r="262" fill="none" stroke="#3ee6d4" stroke-width="7" filter="url(#glow)"/>
  <!-- rim light -->
  <path d="M318 336 A262 262 0 0 1 560 254" fill="none" stroke="#bff8f1" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- target reticle -->
  <g transform="translate(604 438)" filter="url(#softglow)" stroke="#ff8a2a" fill="none" stroke-width="6" stroke-linecap="round">
    <circle r="34"/>
    <circle r="7" fill="#ffd166" stroke="none"/>
    <path d="M0 -58V-44M0 44V58M-58 0H-44M44 0H58"/>
  </g>

  <!-- orbit, front half + satellite -->
  <g transform="translate(512 512) rotate(-24)">
    <path d="M-372 0 A372 112 0 0 0 372 0" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" filter="url(#softglow)"/>
    <circle cx="-239" cy="86" r="20" fill="#fff4e0" filter="url(#glow)"/>
    <circle cx="-239" cy="86" r="11" fill="#ffffff"/>
  </g>
</svg>
